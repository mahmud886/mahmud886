name: Latest Medium posts

# Keeps the "Latest writing" list in the profile README in sync with Medium.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: https://medium.com/feed/@mahmud886
          max_post_count: 5
          template: '- [$title]($url) <sub>· $date</sub>$newline'
          date_format: 'mmm yyyy'
          commit_message: 'docs(readme): refresh latest Medium posts'
