name: Contribution snake

# Draws the contribution-graph snake shown in the profile README.
# The SVGs live on the `output` branch so they never touch the site code.
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/snake.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0c0c0c&color_dots=#ebedf0,#c9c9c5,#9a9a95,#5f5f5b,#0c0c0c
            dist/snake-dark.svg?palette=github-dark&color_snake=#f0f0ec&color_dots=#161b22,#3a3a38,#63635f,#a3a39e,#f0f0ec
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore: update contribution snake'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
